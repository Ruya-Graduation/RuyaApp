name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create environment file
        working-directory: ruya
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # For web builds, .env is optional since we can use query parameters
          if [ -z "$ENV_FILE" ]; then
            echo "ℹ️ ENV_FILE secret not set - web app will use query parameter fallback"
            # Create empty .env to prevent any build warnings
            touch .env
          else
            echo "✅ ENV_FILE secret found - creating .env file"
            printf '%s' "$ENV_FILE" > .env
          fi

      - name: Install dependencies
        working-directory: ruya
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ruya
        run: |
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Create 404 fallback for client-side routing
        working-directory: ruya
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ruya/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4