name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # SECURITY: BASE_URL is injected at BUILD TIME as a compile-time
      # constant via --dart-define-from-file. No .env file is ever created,
      # so there is nothing for the web engine to fetch at runtime.
      - name: Create env.json from secret
        working-directory: ruya
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
        run: |
          if [ -z "$WEB_BASE_URL" ]; then
            echo "❌ ERROR: WEB_BASE_URL secret is not set!"
            echo ""
            echo "To fix this:"
            echo "  1. Go to: GitHub Repo → Settings → Secrets and variables → Actions"
            echo "  2. Create secret named 'WEB_BASE_URL'"
            echo "  3. Set value to the HTTPS URL, e.g.: https://ruya.runasp.net"
            echo "  4. Push to main again"
            exit 1
          fi

          printf '{"BASE_URL": "%s"}' "$WEB_BASE_URL" > env.json
          echo "✅ env.json created for this build only (not committed, not deployed)"

      - name: Install dependencies
        working-directory: ruya
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ruya
        run: |
          flutter build web \
            --release \
            --dart-define-from-file=env.json \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Create 404 fallback for client-side routing
        working-directory: ruya
        run: cp build/web/index.html build/web/404.html

      - name: Verify no env files leaked into build output
        working-directory: ruya
        run: |
          if [ -f "build/web/.env" ] || [ -f "build/web/env.json" ]; then
            echo "❌ SECURITY ERROR: an env file was found in build output!"
            exit 1
          else
            echo "✅ Security check passed: no env file in build output"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ruya/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "App is live at: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "Security Summary:"
          echo "  ✓ BASE_URL compiled in at build time via --dart-define-from-file"
          echo "  ✓ No env file in deployed build"
          echo "  ✓ Secrets NOT in URLs or query parameters"
